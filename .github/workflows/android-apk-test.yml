name: APK Android de prueba

on:
  push:
    branches: [codex/android-apk-test]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar y verificar la aplicación web
        run: |
          npm ci
          npm run build
          npm run check
      - name: Preparar proyecto Android de prueba
        run: node scripts/prepare-android-test.mjs
      - name: Generar APK instalable
        working-directory: .build/android-test/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Caborca-Access-Control-Android-prueba
          path: .build/android-test/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
